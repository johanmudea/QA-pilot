trigger:
  branches:
    include:
      - main
      - qa-agent/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
    displayName: "Install Node.js"

  - script: npm ci
    displayName: "Install dependencies"

  - script: npx playwright install --with-deps chromium
    displayName: "Install Playwright browser"

  - script: npm run typecheck
    displayName: "Typecheck"

  - script: npm test
    displayName: "Run Cucumber suite"
    continueOnError: true

  - script: npm run report:junit
    displayName: "Convert Cucumber report to JUnit"
    condition: succeededOrFailed()

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: "JUnit"
      testResultsFiles: "reports/junit/*.xml"
      failTaskOnFailedTests: true
    displayName: "Publish test results"

  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: "reports"
      artifact: "reports"
    displayName: "Publish reports (HTML, screenshots, JSON)"

  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: "logs"
      artifact: "logs"
    displayName: "Publish execution logs"
